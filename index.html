    <meta name="theme-color" content="#ECEDE8" />
    <meta name="color-scheme" content="light dark" />

    <script>
      // Set the theme before first paint so a saved dark preference never flashes light.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="loader__inner">
        <div class="loader__head" data-loader-out>
          <p class="mono">Plotting the sheet</p>
          <p class="mono">Navi Mumbai</p>
        </div>
        <div class="loader__foot" data-loader-out>
          <p class="mono loader__hint">A route through five waypoints</p>
          <p class="loader__count num"><span data-loader-count>000</span><span class="loader__total"> / 100</span></p>
        </div>
        <div class="loader__bar" data-loader-bar data-loader-out></div>
      </div>
    </div>

    <div id="app"></div>

    <script>
      // The sheet counts on its own, from the first paint, so the loader never waits on the app.
      (function () {
        var root = document.getElementById('loader');
        if (!root) return;
        var count = root.querySelector('[data-loader-count]');
        var bar = root.querySelector('[data-loader-bar]');
        var MIN = 0.8;
        var t0 = performance.now();
        function frame() {
          var e = (performance.now() - t0) / 1000;
          var v = Math.min(100, (e / MIN) * 100);
          var r = Math.round(v);
          if (count) count.textContent = (r < 10 ? '00' : r < 100 ? '0' : '') + r;
          if (bar) bar.style.transform = 'scaleX(' + v / 100 + ')';
          if (v < 100) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        // If the app never boots, the sheet still lifts.
        window.__loaderFallback = setTimeout(function () {
          root.classList.add('is-out');
          root.hidden = true;
          document.documentElement.classList.add('is-loaded');
        }, 2600);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
